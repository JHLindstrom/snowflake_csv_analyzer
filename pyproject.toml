[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trishula-csv-analyzer"
version = "0.3.0"
description = "Local Snowflake CSV session and funnel analyzer"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Jonas Lindström"}]
dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "reportlab>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
browser-test = ["pytest>=8.0", "playwright>=1.52"]

[project.scripts]
trishula = "cli:main"
trishula-web = "server:main"

[tool.setuptools]
packages = ["trishula_web"]
py-modules = [
    "cli",
    "benchmark",
    "converter",
    "duckdb_config",
    "event_parser",
    "errors",
    "generate_mock_data",
    "insights",
    "performance_profile",
    "server",
    "visualizer",
]

[tool.setuptools.package-data]
trishula_web = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
